<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Organisera, tagga och analysera AI-verktyg och program">
    <meta name="theme-color" content="#3498db">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI-verktyg">
    <title>AI-verktygsorganiserare</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>AI-verktygsorganiserare</h1>
    
    <div class="search-section" role="search" aria-label="Sök efter AI-verktyg">
        <input type="text" id="search-input" class="search-input" 
               placeholder="Sök på namn, beskrivning eller taggar..." 
               aria-label="Söktext">
        <button id="search-button" aria-label="Utför sökning">Sök</button>
        <button id="reset-search" aria-label="Återställ sökfilter">Återställ</button>
    </div>
    
    <div class="filter-section" role="group" aria-label="Filteralternativ">
        <div class="filter-group">
            <span class="filter-label" id="category-label">Kategori:</span>
            <select id="category-filter" class="filter-select" aria-labelledby="category-label">
                <option value="all">Alla</option>
                <option value="Marknadsföring">Marknadsföring</option>
                <option value="Assistent">Assistent</option>
                <option value="Automatisering">Automatisering</option>
                <option value="Bildgenerering">Bildgenerering</option>
                <option value="Textgenerering">Textgenerering</option>
                <option value="Videogenerering">Videogenerering</option>
                <option value="Kodning">Kodning</option>
                <option value="Analys">Analys</option>
                <option value="Annat">Annat</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label" id="price-label">Pris:</span>
            <select id="price-filter" class="filter-select" aria-labelledby="price-label">
                <option value="all">Alla</option>
                <option value="free">Gratis</option>
                <option value="freemium">Freemium</option>
                <option value="paid">Betald</option>
                <option value="subscription">Prenumeration</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label" id="rating-label">Betyg:</span>
            <select id="rating-filter" class="filter-select" aria-labelledby="rating-label">
                <option value="all">Alla</option>
                <option value="5">5 stjärnor</option>
                <option value="4">4+ stjärnor</option>
                <option value="3">3+ stjärnor</option>
            </select>
        </div>
    </div>
    
    <div class="container">
        <div class="input-section">
            <h2 id="form-heading">Lägg till AI-verktyg</h2>
            <form id="tool-form" aria-labelledby="form-heading">
                <div class="form-group">
                    <label for="tool-name">Namn på verktyg:</label>
                    <input type="text" id="tool-name" required aria-required="true">
                </div>
                
                <div class="form-group">
                    <label for="tool-url">URL/Hemsida:</label>
                    <input type="url" id="tool-url" placeholder="https://...">
                </div>
                
                <div class="form-group">
                    <label for="tool-description">Beskrivning (vad gör det?):</label>
                    <textarea id="tool-description" required aria-required="true"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="tool-category">Kategori:</label>
                    <select id="tool-category" required aria-required="true">
                        <option value="Marknadsföring">Marknadsföring</option>
                        <option value="Assistent">Assistent</option>
                        <option value="Automatisering">Automatisering</option>
                        <option value="Bildgenerering">Bildgenerering</option>
                        <option value="Textgenerering">Textgenerering</option>
                        <option value="Videogenerering">Videogenerering</option>
                        <option value="Kodning">Kodning</option>
                        <option value="Analys">Analys</option>
                        <option value="Annat">Annat</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="tool-price">Prismodell:</label>
                    <select id="tool-price" required aria-required="true">
                        <option value="free">Gratis</option>
                        <option value="freemium">Freemium</option>
                        <option value="paid">Betald</option>
                        <option value="subscription">Prenumeration</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="tool-cost">Ungefärlig kostnad (valfritt):</label>
                    <input type="text" id="tool-cost" placeholder="t.ex. $10/månad eller 99kr/år">
                </div>
                
                <div class="form-group">
                    <label for="tool-rating">Betyg (1-5):</label>
                    <select id="tool-rating" required aria-required="true">
                        <option value="5">5 - Utmärkt</option>
                        <option value="4">4 - Mycket bra</option>
                        <option value="3">3 - Bra</option>
                        <option value="2">2 - OK</option>
                        <option value="1">1 - Dålig</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label id="tags-label">Funktionstaggar:</label>
                    <div class="checkbox-group" role="group" aria-labelledby="tags-label">
                        <label class="checkbox-label tag-marknadsföring">
                            <input type="checkbox" value="marknadsföring"> Marknadsföring
                        </label>
                        <label class="checkbox-label tag-assistenter">
                            <input type="checkbox" value="assistent"> Assistent
                        </label>
                        <label class="checkbox-label tag-automatisering">
                            <input type="checkbox" value="automatisering"> Automatisering
                        </label>
                        <label class="checkbox-label tag-text">
                            <input type="checkbox" value="text"> Text
                        </label>
                        <label class="checkbox-label tag-bild">
                            <input type="checkbox" value="bild"> Bild
                        </label>
                        <label class="checkbox-label tag-video">
                            <input type="checkbox" value="video"> Video
                        </label>
                        <label class="checkbox-label tag-kod">
                            <input type="checkbox" value="kod"> Kod
                        </label>
                        <label class="checkbox-label tag-analys">
                            <input type="checkbox" value="analys"> Analys
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="custom-tags">Egna taggar (kommaseparerade):</label>
                    <input type="text" id="custom-tags" placeholder="t.ex. openai, produktivitet, hemsidor">
                </div>
                
                <div class="form-group">
                    <label for="tool-notes">Anteckningar (för- och nackdelar, användningsområden):</label>
                    <textarea id="tool-notes"></textarea>
                </div>
                
                <button type="submit" aria-label="Lägg till verktyg i listan">Lägg till verktyg</button>
            </form>
            
            <div class="export-import">
                <h3>Exportera/Importera data</h3>
                <button id="export-data" aria-label="Exportera alla verktyg till JSON-fil" title="Exportera dina AI-verktyg till en JSON-fil för backup eller delning">Exportera till fil</button>
                <div class="form-group">
                    <label for="import-file">Importera från fil:</label>
                    <input type="file" id="import-file" accept=".json" aria-label="Välj JSON-fil att importera">
                </div>
                <button id="import-data" aria-label="Importera verktyg från JSON-fil" title="Importera AI-verktyg från en tidigare exporterad JSON-fil">Importera</button>
            </div>
        </div>
        
        <div class="tools-section">
            <h2>Dina AI-verktyg</h2>
            <div id="tools-list" class="tools-list" role="list" aria-label="Lista över AI-verktyg">
                <!-- Verktyg kommer att visas här -->
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
